[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "symfc-vasp"
version = "0.1.1"
description = "Fit symfc force constants and phonopy/phono3py analysis from fixed-cell VASP trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
keywords = ["VASP", "symfc", "phonopy", "phono3py", "force constants", "molecular dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6",
    "phonopy>=4.0,<5",
    "phono3py>=4.0,<5",
    "symfc>=1.7,<2",
    "seekpath>=2.0",
    "spglib>=2.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]
stress-test = ["mp-api>=0.46", "pymatgen>=2025.10"]

[project.scripts]
symfc-vasp = "symfc_vasp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symfc_vasp = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
