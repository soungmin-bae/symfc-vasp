[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "symfc-vasp"
version = "0.1.1"
description = "Fit finite-temperature force constants from VASP molecular-dynamics trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["VASP", "symfc", "phonopy", "phono3py", "force constants", "molecular dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6",
    "phonopy>=2.20",
    "phono3py>=3.0",
    "symfc>=1.3",
    "seekpath>=2.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.scripts]
symfc-vasp = "symfc_vasp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
